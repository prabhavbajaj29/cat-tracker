<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT Prep Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text-2: #5a5a55;
      --text-3: #9a9a94;
      --blue: #185FA5;
      --blue-light: #E6F1FB;
      --blue-mid: #B5D4F4;
      --green: #3B6D11;
      --green-light: #EAF3DE;
      --amber: #BA7517;
      --amber-light: #FAEEDA;
      --purple: #534AB7;
      --purple-light: #EEEDFE;
      --red: #A32D2D;
      --red-light: #FCEBEB;
      --radius: 10px;
      --radius-lg: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Layout */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      padding: 1.5rem 0;
      z-index: 10;
    }

    .sidebar-logo {
      padding: 0 1.25rem 1.5rem;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 1rem;
    }
    .sidebar-logo h1 { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .sidebar-logo p { font-size: 11px; color: var(--text-3); margin-top: 3px; }

    .sidebar-section { padding: 0 0.75rem; margin-bottom: 1.5rem; }
    .sidebar-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 0.5rem; margin-bottom: 4px; }

    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px; border-radius: 8px;
      font-size: 13px; color: var(--text-2);
      cursor: pointer; transition: all 0.15s;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--blue-light); color: var(--blue); font-weight: 500; }
    .nav-item i { font-size: 16px; }
    .nav-badge { margin-left: auto; font-size: 10px; background: var(--surface2); color: var(--text-3); padding: 1px 6px; border-radius: 99px; }
    .nav-item.active .nav-badge { background: var(--blue-mid); color: var(--blue); }

    .sidebar-bottom { margin-top: auto; padding: 1rem 1.25rem 0; border-top: 0.5px solid var(--border); }
    .streak-card { background: var(--blue-light); border-radius: var(--radius); padding: 0.75rem 1rem; }
    .streak-card p { font-size: 11px; color: var(--blue); font-weight: 500; }
    .streak-card .streak-num { font-size: 22px; font-weight: 600; color: var(--blue); }
    .streak-card .streak-sub { font-size: 11px; color: #378ADD; }

    /* Main */
    .main { margin-left: 240px; flex: 1; padding: 2rem; max-width: calc(100vw - 240px); }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; gap: 1rem; }
    .topbar-left h2 { font-size: 20px; font-weight: 600; }
    .topbar-left p { font-size: 13px; color: var(--text-3); margin-top: 2px; }
    .date-nav { display: flex; align-items: center; gap: 8px; }
    .date-nav button { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--text-2); font-size: 16px; transition: all 0.15s; }
    .date-nav button:hover { background: var(--surface2); }
    .date-display { font-size: 13px; font-weight: 500; color: var(--text); background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: 8px; padding: 6px 14px; min-width: 180px; text-align: center; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
    .stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 600; color: var(--text); }
    .stat-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; }
    .progress-wrap { height: 4px; background: var(--surface2); border-radius: 99px; margin-top: 8px; }
    .progress-fill { height: 4px; background: var(--blue); border-radius: 99px; transition: width 0.4s ease; }

    /* Add Goal */
    .add-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.25rem; }
    .add-card h3 { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .form-row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

    input[type="text"], select {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 8px 12px;
      border: 0.5px solid var(--border-strong);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input[type="text"]:focus, select:focus { border-color: var(--blue); }
    select { cursor: pointer; }

    .btn-primary {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-primary:hover { background: #0C447C; }

    /* Filter tabs */
    .filter-row { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .filter-tab { font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 99px; border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text-2); cursor: pointer; transition: all 0.15s; }
    .filter-tab:hover { background: var(--surface2); }
    .filter-tab.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue-mid); }
    .filter-right { margin-left: auto; display: flex; gap: 6px; }
    .sort-btn { font-size: 12px; padding: 5px 12px; border-radius: 99px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text-3); cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .sort-btn:hover { background: var(--surface2); color: var(--text-2); }

    /* Goals */
    .goals-container { display: flex; flex-direction: column; gap: 8px; }
    .section-divider { display: flex; align-items: center; gap: 10px; margin: 0.75rem 0 0.25rem; }
    .section-divider span { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
    .section-divider hr { flex: 1; border: none; border-top: 0.5px solid var(--border); }

    .goal-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
    }
    .goal-card.done { background: var(--green-light); border-color: #C0DD97; }
    .goal-card.done .goal-title { text-decoration: line-through; color: var(--text-3); }

    .goal-row { display: flex; align-items: center; gap: 12px; padding: 0.875rem 1rem; }
    .check-btn {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s; color: transparent;
    }
    .check-btn:hover { border-color: var(--green); background: var(--green-light); }
    .check-btn.checked { background: var(--green); border-color: var(--green); color: #fff; }
    .check-btn i { font-size: 13px; }

    .goal-body { flex: 1; min-width: 0; }
    .goal-title { font-size: 14px; font-weight: 500; color: var(--text); }
    .goal-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }

    .pill { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 99px; }
    .pill-QA { background: var(--blue-light); color: var(--blue); }
    .pill-LRDI { background: var(--amber-light); color: var(--amber); }
    .pill-VARC { background: var(--purple-light); color: var(--purple); }
    .pill-General { background: var(--surface2); color: var(--text-2); }

    .time-badge { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 3px; }
    .goal-note-text { font-size: 11px; color: var(--text-3); font-style: italic; margin-top: 2px; }

    .goal-actions { display: flex; gap: 2px; }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 6px; color: var(--text-3); font-size: 16px; display: flex; align-items: center; transition: all 0.15s; }
    .icon-btn:hover { background: var(--surface2); color: var(--text-2); }
    .icon-btn.danger:hover { background: var(--red-light); color: var(--red); }

    /* Empty */
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-3); }
    .empty i { font-size: 36px; margin-bottom: 0.75rem; display: block; }
    .empty p { font-size: 14px; }
    .empty small { font-size: 12px; color: var(--text-3); }

    /* History page */
    .page { display: none; }
    .page.active { display: block; }

    .history-day { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; }
    .history-day-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; cursor: pointer; }
    .history-day-header h3 { font-size: 14px; font-weight: 600; color: var(--text); }
    .history-day-header .day-stats { display: flex; align-items: center; gap: 8px; }
    .history-day-header .day-stat { font-size: 12px; color: var(--text-3); }
    .history-day-body { border-top: 0.5px solid var(--border); padding: 0.75rem 1.25rem; display: none; }
    .history-day-body.open { display: block; }
    .history-goal-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
    .history-goal-item:last-child { border-bottom: none; }
    .history-done-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .history-goal-item p { font-size: 13px; color: var(--text); flex: 1; }
    .history-goal-item p.done-text { text-decoration: line-through; color: var(--text-3); }

    /* Toast */
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--text); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
    .toast.show { opacity: 1; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; max-width: 100vw; padding: 1rem; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1><i class="ti ti-book-2" style="color:#185FA5"></i> CAT Tracker</h1>
      <p>Daily prep goal manager</p>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Menu</div>
      <button class="nav-item active" onclick="showPage('today')">
        <i class="ti ti-calendar-today"></i> Today's Goals
        <span class="nav-badge" id="navTodayBadge">0</span>
      </button>
      <button class="nav-item" onclick="showPage('history')">
        <i class="ti ti-history"></i> History
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Sections</div>
      <button class="nav-item" onclick="showPage('today'); setFilter('QA')">
        <i class="ti ti-math"></i> Quantitative (QA)
      </button>
      <button class="nav-item" onclick="showPage('today'); setFilter('LRDI')">
        <i class="ti ti-chart-bar"></i> LRDI
      </button>
      <button class="nav-item" onclick="showPage('today'); setFilter('VARC')">
        <i class="ti ti-book"></i> VARC
      </button>
    </div>

    <div class="sidebar-bottom">
      <div class="streak-card">
        <p>🔥 Study streak</p>
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-sub">days in a row</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- TODAY PAGE -->
    <div class="page active" id="page-today">
      <div class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Today's Goals</h2>
          <p id="pageSubtitle"></p>
        </div>
        <div class="date-nav">
          <button onclick="changeDay(-1)" title="Previous day"><i class="ti ti-chevron-left"></i></button>
          <div class="date-display" id="dateDisplay"></div>
          <button onclick="changeDay(1)" title="Next day"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total goals</div>
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-sub">for this day</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="statDone">0</div>
          <div class="stat-sub">marked done</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Remaining</div>
          <div class="stat-value" id="statLeft">0</div>
          <div class="stat-sub">to finish</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Progress</div>
          <div class="stat-value" id="statPct">0%</div>
          <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
      </div>

      <div class="add-card">
        <h3>Add new goal</h3>
        <div class="form-row">
          <input type="text" id="goalInput" placeholder="e.g. Solve 20 TSD problems, Read RC passage set…" />
          <select id="sectionSelect">
            <option value="QA">QA</option>
            <option value="LRDI">LRDI</option>
            <option value="VARC">VARC</option>
            <option value="General">General</option>
          </select>
          <select id="durationSelect">
            <option value="">No time</option>
            <option value="15 min">15 min</option>
            <option value="30 min">30 min</option>
            <option value="45 min">45 min</option>
            <option value="1 hr">1 hr</option>
            <option value="1.5 hr">1.5 hr</option>
            <option value="2 hr">2 hr</option>
            <option value="3 hr">3 hr</option>
          </select>
          <button class="btn-primary" onclick="addGoal()"><i class="ti ti-plus"></i> Add</button>
        </div>
        <div class="form-row2">
          <input type="text" id="noteInput" placeholder="Note (optional) — e.g. focus on remainders, attempt from AIMCAT 2024" />
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-tab active" onclick="setFilter('All')">All</div>
        <div class="filter-tab" onclick="setFilter('QA')">QA</div>
        <div class="filter-tab" onclick="setFilter('LRDI')">LRDI</div>
        <div class="filter-tab" onclick="setFilter('VARC')">VARC</div>
        <div class="filter-tab" onclick="setFilter('General')">General</div>
        <div class="filter-tab" onclick="setFilter('Done')">✓ Done</div>
        <div class="filter-right">
          <button class="sort-btn" onclick="clearDayGoals()"><i class="ti ti-trash" style="font-size:13px"></i> Clear day</button>
        </div>
      </div>

      <div class="goals-container" id="goalsList"></div>
    </div>

    <!-- HISTORY PAGE -->
    <div class="page" id="page-history">
      <div class="topbar">
        <div class="topbar-left">
          <h2>History</h2>
          <p>All your past study days</p>
        </div>
      </div>
      <div id="historyList"></div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────
  let currentDate = todayKey();
  let filter = 'All';
  let idCounter = 1;

  function todayKey() {
    const d = new Date();
    return d.toISOString().split('T')[0];
  }

  function dateFromKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatKey(key) {
    const d = dateFromKey(key);
    const today = todayKey();
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yKey = yesterday.toISOString().split('T')[0];
    if (key === today) return 'Today — ' + d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    if (key === yKey) return 'Yesterday — ' + d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ── Storage ────────────────────────────────────────────
  function loadAll() {
    try { return JSON.parse(localStorage.getItem('cat_goals') || '{}'); } catch { return {}; }
  }

  function saveAll(data) {
    localStorage.setItem('cat_goals', JSON.stringify(data));
  }

  function getDay(key) {
    const all = loadAll();
    return all[key] || [];
  }

  function saveDay(key, goals) {
    const all = loadAll();
    all[key] = goals;
    saveAll(all);
  }

  function nextId() {
    const all = loadAll();
    let max = 0;
    Object.values(all).forEach(arr => arr.forEach(g => { if (g.id > max) max = g.id; }));
    return max + 1;
  }

  // ── UI helpers ─────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if (name === 'today') {
      document.querySelectorAll('.nav-item')[0].classList.add('active');
      render();
    } else if (name === 'history') {
      document.querySelectorAll('.nav-item')[1].classList.add('active');
      renderHistory();
    }
  }

  // ── Date nav ───────────────────────────────────────────
  function changeDay(delta) {
    const d = dateFromKey(currentDate);
    d.setDate(d.getDate() + delta);
    const newKey = d.toISOString().split('T')[0];
    // Don't allow future dates beyond today
    if (newKey > todayKey()) return;
    currentDate = newKey;
    filter = 'All';
    document.querySelectorAll('.filter-tab').forEach((t, i) => t.classList.toggle('active', i === 0));
    render();
  }

  // ── Add goal ───────────────────────────────────────────
  function addGoal() {
    const title = document.getElementById('goalInput').value.trim();
    if (!title) { showToast('Please enter a goal!'); return; }
    const section = document.getElementById('sectionSelect').value;
    const duration = document.getElementById('durationSelect').value;
    const note = document.getElementById('noteInput').value.trim();
    const goals = getDay(currentDate);
    goals.unshift({ id: nextId(), title, section, duration, note, done: false, createdAt: Date.now() });
    saveDay(currentDate, goals);
    document.getElementById('goalInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('durationSelect').value = '';
    updateStreak();
    render();
    showToast('Goal added!');
  }

  document.getElementById('goalInput').addEventListener('keydown', e => { if (e.key === 'Enter') addGoal(); });

  // ── Toggle done ────────────────────────────────────────
  function toggleDone(id) {
    const goals = getDay(currentDate);
    const g = goals.find(x => x.id === id);
    if (g) g.done = !g.done;
    saveDay(currentDate, goals);
    updateStreak();
    render();
  }

  function deleteGoal(id) {
    let goals = getDay(currentDate);
    goals = goals.filter(x => x.id !== id);
    saveDay(currentDate, goals);
    render();
    showToast('Goal removed');
  }

  function clearDayGoals() {
    if (!confirm('Clear all goals for this day?')) return;
    saveDay(currentDate, []);
    render();
    showToast('Day cleared');
  }

  // ── Filter ─────────────────────────────────────────────
  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filter-tab').forEach(t => {
      const label = t.textContent.trim().replace(/^✓\s*/, '');
      t.classList.toggle('active', label === f || (f === 'Done' && t.textContent.includes('Done')));
    });
    render();
  }

  // ── Streak ─────────────────────────────────────────────
  function updateStreak() {
    const all = loadAll();
    const today = todayKey();
    let streak = 0;
    let d = new Date();
    while (true) {
      const key = d.toISOString().split('T')[0];
      const goals = all[key] || [];
      if (goals.length === 0 && key !== today) break;
      if (goals.length > 0) streak++;
      d.setDate(d.getDate() - 1);
      if (streak > 365) break;
    }
    document.getElementById('streakNum').textContent = streak;
  }

  // ── Render today ───────────────────────────────────────
  function render() {
    const goals = getDay(currentDate);
    const total = goals.length;
    const done = goals.filter(g => g.done).length;
    const left = total - done;
    const pct = total ? Math.round((done / total) * 100) : 0;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statLeft').textContent = left;
    document.getElementById('statPct').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('dateDisplay').textContent = formatKey(currentDate);
    document.getElementById('navTodayBadge').textContent = left;

    const isToday = currentDate === todayKey();
    document.getElementById('pageTitle').textContent = isToday ? "Today's Goals" : formatKey(currentDate).split(' — ')[0];
    document.getElementById('pageSubtitle').textContent = isToday ? new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : formatKey(currentDate).split(' — ')[1] || '';

    let visible = goals;
    if (filter === 'Done') visible = goals.filter(g => g.done);
    else if (filter !== 'All') visible = goals.filter(g => g.section === filter);

    const list = document.getElementById('goalsList');
    if (visible.length === 0) {
      list.innerHTML = `<div class="empty"><i class="ti ti-clipboard-list"></i><p>${filter === 'Done' ? 'No completed goals yet — keep going!' : 'No goals here. Add one above!'}</p><small>${isToday ? 'Plan your study session for today.' : ''}</small></div>`;
      return;
    }

    const pending = visible.filter(g => !g.done);
    const completed = visible.filter(g => g.done);
    let html = '';
    if (pending.length) html += pending.map(renderGoal).join('');
    if (completed.length) {
      if (pending.length) html += `<div class="section-divider"><span>Completed</span><hr></div>`;
      html += completed.map(renderGoal).join('');
    }
    list.innerHTML = html;
  }

  function renderGoal(g) {
    return `<div class="goal-card${g.done ? ' done' : ''}">
      <div class="goal-row">
        <button class="check-btn${g.done ? ' checked' : ''}" onclick="toggleDone(${g.id})" title="${g.done ? 'Mark undone' : 'Mark done'}">
          <i class="ti ti-check"></i>
        </button>
        <div class="goal-body">
          <div class="goal-title">${esc(g.title)}</div>
          <div class="goal-meta">
            <span class="pill pill-${g.section}">${g.section}</span>
            ${g.duration ? `<span class="time-badge"><i class="ti ti-clock" style="font-size:11px"></i>${g.duration}</span>` : ''}
          </div>
          ${g.note ? `<div class="goal-note-text">${esc(g.note)}</div>` : ''}
        </div>
        <div class="goal-actions">
          <button class="icon-btn danger" onclick="deleteGoal(${g.id})" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>`;
  }

  // ── Render history ─────────────────────────────────────
  function renderHistory() {
    const all = loadAll();
    const keys = Object.keys(all).sort((a, b) => b.localeCompare(a));
    const list = document.getElementById('historyList');
    if (keys.length === 0) {
      list.innerHTML = `<div class="empty"><i class="ti ti-history"></i><p>No history yet. Start adding goals today!</p></div>`;
      return;
    }
    list.innerHTML = keys.map((key, idx) => {
      const goals = all[key];
      const done = goals.filter(g => g.done).length;
      const pct = goals.length ? Math.round((done / goals.length) * 100) : 0;
      return `<div class="history-day">
        <div class="history-day-header" onclick="toggleHistoryDay('hd-${idx}')">
          <h3>${formatKey(key)}</h3>
          <div class="day-stats">
            <span class="day-stat">${done}/${goals.length} done</span>
            <span class="pill ${pct === 100 ? 'pill-QA' : 'pill-General'}" style="font-size:11px">${pct}%</span>
            <i class="ti ti-chevron-down" style="font-size:16px;color:var(--text-3)"></i>
          </div>
        </div>
        <div class="history-day-body" id="hd-${idx}">
          ${goals.length === 0 ? '<p style="font-size:13px;color:var(--text-3)">No goals recorded.</p>' : goals.map(g => `
            <div class="history-goal-item">
              <div class="history-done-dot" style="background:${g.done ? '#639922' : '#D3D1C7'}"></div>
              <p class="${g.done ? 'done-text' : ''}">${esc(g.title)}</p>
              <span class="pill pill-${g.section}" style="font-size:10px">${g.section}</span>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');
  }

  function toggleHistoryDay(id) {
    const el = document.getElementById(id);
    el.classList.toggle('open');
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ───────────────────────────────────────────────
  updateStreak();
  render();
</script>
</body>
</html>
